<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Konkursowy</title>
<style>
body { font-family: Arial; }
.task { width:18px; height:18px; display:inline-block; margin:1px; }
.grey { background:lightgrey; }
.empty { background:white; border:1px solid black; }
.full { background:green; }
</style>
</head>
<body>

<h2>Tablica wyników</h2>
<div id="scoreboard"></div>

<hr>

<h2> Panel sędziego</h2>
Kod (4 cyfry): <input id="codeInput" maxlength="4">

<h3 id="judgeMessage"></h3>

<hr>

<h2> Dodaj drużynę</h2>
Nazwa: <input id="newName">
Start od zadania: <input id="startTask" type="number">
<button onclick="addTeam()">Dodaj</button>

<script>
async function refresh() {
    const res = await fetch("/teams");
    const teams = await res.json();

    const div = document.getElementById("scoreboard");
    div.innerHTML = "";

    teams.forEach(t => {
        const row = document.createElement("div");
        row.innerHTML = "<b>" + t.name + " (" + t.points + " pkt)</b><br>";

        t.tasks.forEach(task => {
            const box = document.createElement("div");
            box.className = "task " + task;
            row.appendChild(box);
        });

        div.appendChild(row);
        div.appendChild(document.createElement("hr"));
    });
}

async function scan(code) {

    const res = await fetch("/scan", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ code })
    });

    const data = await res.json();
    const msg = document.getElementById("judgeMessage");

    if (data.success) {
        msg.style.color = "green";
        msg.innerText = "✅ " + data.success;
    } else {
        msg.style.color = "red";
        msg.innerText = "❌ " + data.error;
    }

    refresh();
}

// obsługa skanera (Enter)
document.getElementById("codeInput")
.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const code = this.value.trim();
        if (code.length === 4) {
            scan(code);
        }
        this.value = ""; // auto czyszczenie
    }
});

async function addTeam() {
    const name = document.getElementById("newName").value;
    const startTask = parseInt(document.getElementById("startTask").value);

    await fetch("/add-team", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ name, startTask })
    });

    refresh();
}

refresh();
</script>

</body>
</html>
